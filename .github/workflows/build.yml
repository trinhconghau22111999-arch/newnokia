name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # cần để tạo Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Giải mã khóa ký cố định
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/phonecuibap.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/phonecuibap.jks" >> "$GITHUB_ENV"
          else
            echo "::error::Chưa có secret KEYSTORE_B64 - không build để tránh ra APK ký khóa ngẫu nhiên (không cài đè được)"
            exit 1
          fi
      - name: Build release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set +e
          gradle assembleRelease --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Execution failed|Caused by|AAPT|Error:" -A3 build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=Gradle loi::$msg"
            tail -30 build.log
          fi
          exit $code
      - name: Đưa APK lên Releases (tên file cố định)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" phonecuibap.apk
          # Mỗi lần build tạo một Release mới (giữ lịch sử), đánh dấu là bản mới nhất.
          # Đường dẫn tải không đổi: releases/latest/download/phonecuibap.apk
          gh release create "build-${GITHUB_RUN_NUMBER}" phonecuibap.apk \
            --target "$GITHUB_SHA" \
            --title "Bản build ${GITHUB_RUN_NUMBER}" \
            --notes "Commit ${GITHUB_SHA::7}" \
            --latest
